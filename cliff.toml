# git-cliff configuration: https://git-cliff.org/docs/configuration
# Preview the next release: just release-notes

[remote.github]
owner = "jovalle"
repo = "watchtower"

[changelog]
header = """
# Changelog

All notable changes to Watchtower are documented here. Versions follow \
[Semantic Versioning](https://semver.org) and notes are generated from \
[Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- macro commit_line(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim }}
{%- if commit.breaking %} **[breaking]**{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{%- if commit.remote.username %}{% if commit.remote.username != remote.github.owner %} by @{{ commit.remote.username }}{% endif %}{% endif %}
{%- endmacro -%}

{%- macro commit_entry(commit) -%}
{{ self::commit_line(commit=commit) }}
{%- if commit.body %}

{{ commit.body | trim | indent(prefix="  ", first=true, blank=false) }}

{% endif %}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/\
{%- if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}releases/tag/{{ version }}{% endif %}) \
({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## [Unreleased]({{ self::remote_url() }}/compare/{{ previous.version | default(value="main") }}...HEAD)
{%- endif %}

{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 -%}
> [!WARNING]
> **Breaking changes.** Review these before upgrading.
>
{% for commit in breaking -%}
> - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.breaking_description | default(value=commit.message) | replace(from="\n", to=" ") | upper_first }}
{% endfor %}
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
{% if group is containing("Maintenance") -%}
<details>
<summary><strong>{{ group | striptags | trim }}</strong> ({{ commits | length }})</summary>

{% for commit in commits -%}
{{ self::commit_line(commit=commit) }}
{% endfor %}
</details>
{% else -%}
### {{ group | striptags | trim }}

{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
{{ self::commit_entry(commit=commit) }}
{% endfor -%}
{% for commit in commits -%}
{% if not commit.scope %}{{ self::commit_entry(commit=commit) }}
{% endif -%}
{% endfor %}
{% endif -%}
{% endfor %}

{%- if github -%}
{% set newcomers = github.contributors | filter(attribute="is_first_time", value=true) -%}
{% set_global humans = [] -%}
{% for contributor in newcomers -%}
{% if contributor.username and contributor.username != remote.github.owner and not contributor.username is ending_with("[bot]") and not contributor.username is ending_with("-bot") %}{% set_global humans = humans | concat(with=contributor) %}{% endif -%}
{% endfor -%}
{% if humans | length > 0 %}
### ❤️ New Contributors

{% for contributor in humans -%}
- @{{ contributor.username }} made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{% endif -%}
{%- endif %}

{% if version -%}
### 🐳 Upgrade

```sh
docker pull ghcr.io/{{ remote.github.owner }}/{{ remote.github.repo }}:{{ version | trim_start_matches(pat="v") }}
```

{% if previous.version -%}
**Full Changelog**: [`{{ previous.version }}...{{ version }}`]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }})

{% endif -%}
{% endif -%}
<sub>{{ statistics.commit_count }} commit{{ statistics.commit_count | pluralize }}\
{%- if statistics.days_passed_since_last_release %} · {{ statistics.days_passed_since_last_release }} day\
{{- statistics.days_passed_since_last_release | pluralize }} since {{ previous.version }}{% endif %}</sub>


"""
trim = false
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/jovalle/watchtower" },
  # Unwrap hard-wrapped commit bodies; GitHub releases render single newlines as <br>.
  { pattern = '([^\n])\n  ([^\s\-*>\d])', replace = '${1} ${2}' },
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '(?m)(^|[\s(])#(\d+)\b', replace = '${1}[#${2}](<REPO>/issues/${2})' },
]
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^[a-z]+\(security\)', group = "<!-- 1 -->🛡️ Security" },
  { body = 'CVE-\d{4}-\d+', group = "<!-- 1 -->🛡️ Security" },
  { message = '^feat', group = "<!-- 0 -->🚀 Features" },
  { message = '^fix', group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = '^perf', group = "<!-- 3 -->⚡ Performance" },
  { message = '^refactor', group = "<!-- 4 -->♻️ Refactoring" },
  { message = '^docs?', group = "<!-- 5 -->📚 Documentation" },
  { message = '^revert', group = "<!-- 6 -->⏪ Reverts" },
  { message = '^(chore|ci|build|test|style)', group = "<!-- 9 -->🔧 Maintenance" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
