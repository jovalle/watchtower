services:
  watchtower:
    build:
      context: .
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    container_name: watchtower
    environment:
      # Plex server and token are configured in-app at /setup and saved to ./data/config
      # Optional: generated and saved to ./data/config/session-secret when unset
      SESSION_SECRET: ${SESSION_SECRET:-}
      PLEX_CLIENT_ID: ${PLEX_CLIENT_ID:-watchtower-001}
      PORT: ${WATCHTOWER_PORT:-9001}
      NODE_ENV: production
      # Cookie security: false for LAN/HTTP, true for HTTPS (see .env.example)
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Optional integrations (leave empty to disable)
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9001/",
        ]
      timeout: 3s
    image: watchtower:local
    pull_policy: never
    ports:
      - "${WATCHTOWER_PORT:-9001}:9001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 1001:1001
    volumes:
      - ./data:/data
